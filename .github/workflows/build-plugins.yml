name: Build Plugins

on:
    workflow_dispatch:
    push:
        branches:
            - develop
        paths:
            - "src/**"
            - "packages/**"
            - "scripts/**"
            - "package.json"
            - "package-lock.json"
            - "rollup.config.ts"
            - "tsconfig.json"
            - "global.d.ts"
            - "eslint.config.mjs"
            - ".mocharc.json"
            - ".github/**"
            - "LICENSE"
            - ".gitignore"

permissions:
    contents: write

concurrency:
    group: publish-master
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Test publication
              run: npm run test:publish

            - name: Build all published plugins
              run: npm run build -- --publication

            - name: Publish distribution
              id: publish
              shell: bash
              env:
                  SOURCE_SHA: ${{ github.sha }}
                  REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/master:refs/remotes/origin/master
                  node scripts/publish.mjs fresh "$GITHUB_WORKSPACE" "$SOURCE_SHA" origin/develop
                  master_dir="$(mktemp -d)"
                  stage_dir="$(mktemp -d)"
                  git worktree add --detach "$master_dir" origin/master
                  node scripts/publish.mjs stage "$GITHUB_WORKSPACE" "$stage_dir" "$SOURCE_SHA" "$REPOSITORY"
                  node scripts/publish.mjs apply "$master_dir" "$stage_dir"
                  git -C "$master_dir" add -A
                  if ! git -C "$master_dir" diff --cached --quiet; then
                    git -C "$master_dir" commit -m "Publish plugins from $SOURCE_SHA"
                    git fetch origin +refs/heads/develop:refs/remotes/origin/develop
                    node scripts/publish.mjs fresh "$GITHUB_WORKSPACE" "$SOURCE_SHA" origin/develop
                    git -C "$master_dir" push origin HEAD:master
                  else
                    echo "Distribution already matches source commit $SOURCE_SHA."
                  fi
                  git fetch origin +refs/heads/develop:refs/remotes/origin/develop
                  node scripts/publish.mjs fresh "$GITHUB_WORKSPACE" "$SOURCE_SHA" origin/develop
                  echo "master_dir=$master_dir" >> "$GITHUB_OUTPUT"
                  echo "dist_sha=$(git -C "$master_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Refresh rolling fork release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  DIST_SHA: ${{ steps.publish.outputs.dist_sha }}
                  MASTER_DIR: ${{ steps.publish.outputs.master_dir }}
                  SOURCE_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  TAG="Nightly-Fork"
                  if response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"; then
                    gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
                  elif [[ ! "$response" =~ HTTP/[^[:space:]]+[[:space:]]404 ]]; then
                    echo "$response" >&2
                    exit 1
                  fi
                  set +e
                  git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null
                  tag_status=$?
                  set -e
                  if [ "$tag_status" -eq 0 ]; then
                    git push origin ":refs/tags/$TAG"
                  elif [ "$tag_status" -ne 2 ]; then
                    exit "$tag_status"
                  fi
                  gh release create "$TAG" "$MASTER_DIR"/dist/bd/*.plugin.js \
                    --repo "$GITHUB_REPOSITORY" \
                    --target "$DIST_SHA" \
                    --title "Nightly-Fork" \
                    --notes "Built from source commit $SOURCE_SHA. Browse all published plugins in [dist/bd](https://github.com/$GITHUB_REPOSITORY/tree/master/dist/bd)." \
                    --latest
